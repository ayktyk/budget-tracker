<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<!-- İçerik Güvenlik Politikası: dış script yalnız cdnjs (Chart.js), bağlantı yalnız Gemini API.
     'unsafe-inline' uygulamanın inline onclick/style yapısı için zorunlu; connect-src kısıtı,
     olası bir XSS'in localStorage'daki Gemini anahtarını/veriyi dışarı sızdırmasını engeller. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bütçe · AY</title>
<meta name="theme-color" content="#f4efe6" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bütçe">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">

  <!-- ═══ SCREENS ═══ -->
  <div class="screens">

    <!-- ── Ekranlar (içerikler buildDesignLayout() tarafından runtime'da enjekte edilir) ── -->
    <div id="s-dash" class="screen on"></div>
    <div id="s-quick" class="screen"></div>
    <div id="s-income" class="screen"></div>
    <div id="s-more" class="screen"></div>

    <!-- ── BUDGET (bağımsız ekran, alt nav'daki Bütçe butonu için) ── -->
    <div id="s-budget" class="screen">
      <div class="screen-shell">
        <div class="card">
          <div class="card-h"><h3>Bütçe · Aylık limitler</h3><button type="button" class="fav-add-btn" onclick="openCatForm()" title="Yeni kategori ekle">+ Yeni kategori</button></div>
          <div class="month-scroll" id="budget-month-chips" style="padding:0 0 12px;display:flex;gap:6px"></div>
          <div id="budget-monthlim-card"></div>
          <div id="budget-unrev-panel"></div>
          <div id="budget-bars-main"></div>
          <div class="budget-actions" style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn btn-secondary" style="flex:1;min-width:140px" onclick="recatAllDiger()" title="Diğer kategorisindeki kalemleri otomatik kurallarla yeniden sınıflandır">Yeniden sınıflandır</button>
            <button type="button" class="btn btn-secondary" style="flex:1;min-width:140px" onclick="resetBudgetsToDefault()">Varsayılanlara Sıfırla</button>
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Abonelikler · Aylık</h3><button type="button" class="fav-add-btn" onclick="openSubForm()">+ Yeni</button></div>
          <div id="sub-list"></div>
        </div>
        <div class="section-gap"></div>
      </div>
    </div>

  </div><!-- .screens -->

  <!-- ═══ BOTTOM NAV ═══ -->
  <nav class="nav">
    <button class="nav-item on" onclick="go('dash',this)" id="nb-dash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Genel</span>
    </button>
    <button class="nav-item" onclick="go('income',this)" id="nb-income">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      <span>Gelir</span>
    </button>
    <div class="nav-center">
      <button class="nav-fab" onclick="go('quick',null)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
    <button class="nav-item" onclick="go('more',this)" id="nb-more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>Detaylar</span>
    </button>
    <button class="nav-item" onclick="go('budget-shortcut',this)" id="nb-budget">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span>Bütçe</span>
    </button>
  </nav>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

</div><!-- .app -->

<script src="calc.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
