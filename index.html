<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<!-- İçerik Güvenlik Politikası: dış script yalnız cdnjs (Chart.js), bağlantı yalnız Gemini API.
     'unsafe-inline' uygulamanın inline onclick/style yapısı için zorunlu; connect-src kısıtı,
     olası bir XSS'in localStorage'daki Gemini anahtarını/veriyi dışarı sızdırmasını engeller. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bütçe · AY</title>
<meta name="theme-color" content="#f4efe6" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bütçe">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">

  <!-- ═══ SCREENS ═══ -->
  <div class="screens">

    <!-- ── Ekranlar (içerikler buildDesignLayout() tarafından runtime'da enjekte edilir) ── -->
    <div id="s-dash" class="screen on"></div>
    <div id="s-quick" class="screen"></div>
    <div id="s-income" class="screen"></div>
    <div id="s-more" class="screen"></div>

    <!-- Bütçe ekranı kaldırıldı: kategori limitleri Özet ekranındaki dağılım
         kartına, kategori yönetimi ve abonelikler Araçlar akordeonuna taşındı. -->

  </div><!-- .screens -->

  <!-- ═══ BOTTOM NAV ═══ -->
  <nav class="nav">
    <button class="nav-item on" onclick="go('dash',this)" id="nb-dash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Özet</span>
    </button>
    <button class="nav-item" onclick="go('income',this)" id="nb-income">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      <span>Gelir</span>
    </button>
    <button class="nav-item" onclick="go('quick',this)" id="nb-quick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      <span>Gider</span>
    </button>
    <button class="nav-item" onclick="go('more',this)" id="nb-more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>Araçlar</span>
    </button>
  </nav>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

</div><!-- .app -->

<script src="calc.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
